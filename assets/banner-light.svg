<svg xmlns="http://www.w3.org/2000/svg" width="900" height="236" viewBox="0 0 900 236" role="img" aria-label="Lab instruments and tools streaming data into a log terminal">
<style>
.t{font:600 11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#24292f}
.s{font:500 9.5px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#57606a}
.mini{font:500 8px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#57606a}
.log{font:500 11.5px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#24292f;opacity:0;animation:log 16.8s linear infinite}
.draw{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw 5s ease-in-out infinite}
.ax{stroke-width:1}
.mark{stroke-width:1;stroke-dasharray:2 3}
.breathe{opacity:.12;animation:breathe 5s ease-in-out infinite}
.spin{animation:spin 1.4s linear infinite}
.flow{stroke-dasharray:6 5;animation:flow .8s linear infinite}
.melt{animation:pulse 1.2s ease-in-out infinite}
.beam{opacity:.08;animation:beam 2.7s ease-in-out infinite}
.layer{opacity:0;animation:layer 4.4s ease-out infinite}
.nozzle{animation:noz 1.1s ease-in-out infinite alternate}
.wire{stroke-dasharray:3 5;animation:flow 1s linear infinite}
.cur{animation:blink 1s steps(1) infinite}
@keyframes draw{0%{stroke-dashoffset:100}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
@keyframes breathe{0%,30%{opacity:0}55%,80%{opacity:.14}100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-22}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes beam{0%,100%{opacity:.06}50%{opacity:.38}}
@keyframes layer{0%{opacity:0}10%,85%{opacity:1}100%{opacity:0}}
@keyframes noz{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
@keyframes blink{50%{opacity:0}}
@keyframes log{0%{opacity:0;transform:translateY(6px)}2%{opacity:1;transform:none}13.29%{opacity:1}14.29%,100%{opacity:0}}
</style>
